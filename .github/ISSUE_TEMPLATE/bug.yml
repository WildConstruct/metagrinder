name: Bug
description: Report a parser, package, schema, or workflow defect.
title: "Bug: "
labels:
  - parser
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the observed behavior and why it is wrong.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the fixture, command, or input that reproduces the issue.
      placeholder: |
        1. Run ...
        2. Inspect ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: Describe the correct outcome.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Note the tests or checks needed to prove the fix.
